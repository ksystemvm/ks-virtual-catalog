<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    
    <div>
      <h2 class="mt-4 text-center text-3xl font-extrabold text-gray-900">
        Recuperar Contraseña
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Ingresa tu correo y te enviaremos las instrucciones para restablecer tu acceso.
      </p>
    </div>

    <form class="mt-8 space-y-6" (ngSubmit)="enviarEnlace()">
      
      <div *ngIf="mensaje" class="bg-blue-50 border border-blue-200 text-blue-700 px-4 py-3 rounded relative text-sm">
        {{ mensaje }}
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
        <input type="email" required [(ngModel)]="email" name="email"
          class="appearance-none rounded relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
          placeholder="tu@correo.com">
      </div>

      <div>
        <button type="submit" [disabled]="cargando"
          class="w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors disabled:opacity-50">
          {{ cargando ? 'Enviando...' : 'Enviar instrucciones' }}
        </button>
      </div>
    </form>

    <div class="mt-6 border-t border-gray-200 pt-4 text-center">
      <a routerLink="/login" class="text-sm font-medium text-indigo-600 hover:text-indigo-500 transition-colors">
        &larr; Volver al inicio de sesión
      </a>
    </div>
  </div>
</div>
