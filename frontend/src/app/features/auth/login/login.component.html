<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    
    <div>
      <h2 class="mt-4 text-center text-3xl font-extrabold text-gray-900">
        Bienvenido al Catálogo
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Ingresa a tu cuenta para continuar
      </p>
    </div>

    <form class="mt-8 space-y-6" (ngSubmit)="iniciarSesion()">
      
      <div *ngIf="mensajeError" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
        <span class="block sm:inline">{{ mensajeError }}</span>
      </div>

      <div class="rounded-md shadow-sm -space-y-px">
        <div class="mb-4">
          <label for="identificador" class="block text-sm font-medium text-gray-700 mb-1">Usuario o Correo Electrónico</label>
          <input id="identificador" name="identificador" type="text" required [(ngModel)]="identificador"
            class="appearance-none rounded relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
            placeholder="juanperez / juan@correo.com">
        </div>

        <div class="mb-4">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input id="password" name="password" type="password" required [(ngModel)]="password"
            class="appearance-none rounded relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
            placeholder="••••••••">
        </div>
      </div>

      <div class="flex items-center justify-between mt-4">
        <div class="text-sm">
          <a routerLink="/recuperar-password" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">
            ¿Olvidaste tu contraseña?
          </a>
        </div>
      </div>

      <div>
        <button type="submit" [disabled]="cargando"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors disabled:opacity-50">
          {{ cargando ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
        </button>
      </div>
    </form>

    <div class="mt-6 border-t border-gray-200 pt-4 text-center">
      <p class="text-sm text-gray-600">
        ¿No tienes una cuenta?
        <a routerLink="/registro" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">
          Regístrate aquí
        </a>
      </p>
    </div>
  </div>
</div>
